<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" role="img" aria-label="Elektronika przejmuje sterowanie dopiero po zakończeniu zadania" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="lot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="484" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#111827">Elektronika przejmuje sterowanie dopiero po zakończeniu zadania</text>

  <g fill="none" stroke="#6b7280" stroke-width="1.25">
    <path d="M194 112V152" marker-end="url(#lot-arrow)"/>
    <path d="M194 224V280" marker-end="url(#lot-arrow)"/>
    <path d="M194 352V400" marker-end="url(#lot-arrow)"/>
    <path d="M612 352V428H364" marker-end="url(#lot-arrow)"/>
  </g>

  <rect x="24" y="56" width="340" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="80" font-weight="600" fill="#111827">1. Hol ręczny</text>
  <text x="40" y="96" font-size="11.5" fill="#4b5563">Stery w pozycji do holu, autopilot nieaktywny</text>

  <rect x="24" y="152" width="340" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="176" font-weight="600" fill="#111827">2. Zadanie: lot swobodny</text>
  <text x="40" y="192" font-size="11.5" fill="#4b5563">60–120 s (F1H), stały trym jak w wolnym locie</text>
  <text x="40" y="208" font-size="11.5" fill="#4b5563">Elektronika tylko mierzy, RC tylko do awaryjnego DT</text>

  <rect x="24" y="280" width="340" height="72" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="304" font-weight="600" fill="#111827">3. Powrót (RTL)</text>
  <text x="40" y="320" font-size="11.5" fill="#111827">Rozpędzenie do 7–9 m/s, lot nad start</text>
  <text x="40" y="336" font-size="11.5" fill="#111827">Pilot RC może od tej chwili przejąć stery</text>

  <rect x="24" y="400" width="340" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="424" font-weight="600" fill="#111827">4. Lądowanie</text>
  <text x="40" y="440" font-size="11.5" fill="#4b5563">Od razu po dolocie, bez krążenia nad startem</text>

  <rect x="488" y="280" width="248" height="72" rx="8" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
  <text x="504" y="304" font-weight="600" fill="#111827">Awaria</text>
  <text x="504" y="320" font-size="11.5" fill="#111827">Utrata GPS w fazie powrotu</text>
  <text x="504" y="336" font-size="11.5" fill="#111827">Odpalenie determalizatora</text>

  <text x="206" y="136" font-size="11.5" fill="#4b5563">odczepienie (przełącznik haka)</text>
  <text x="206" y="246" font-size="11.5" fill="#4b5563">koniec czasu zadania</text>
  <text x="206" y="262" font-size="11.5" fill="#4b5563">albo wcześniej: odległość &gt; R lub brak zapasu wysokości</text>
  <text x="206" y="380" font-size="11.5" fill="#4b5563">model nad startem</text>
  <text x="600" y="392" text-anchor="end" font-size="11.5" fill="#4b5563">natychmiastowy DT</text>
</svg>
